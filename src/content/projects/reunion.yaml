title: Reunion
year: 2023
category: school
template: reel
order: 5
size: wide
accentFrom: "#D98A2B"
accentTo: "#3F6B4A"
client: Communication University of China
posterGenre:
  en: CUC 2023
  fr: CUC 2023
  zh: 中传 2023
roles:
  en: [Concept, Prop design, Storyboard, Background, Animation, Compositing]
  fr: [Concept, Design d'accessoires, Storyboard, Décors, Animation, Compositing]
  zh: [概念设计, 道具设计, 分镜, 背景美术, 动画, 合成]
subtitle:
  en: collaborative short, Communication University of China, 2023
  fr: court métrage collectif, Communication University of China, 2023
  zh: 中国传媒大学合作短片，2023
description:
  en: >-
    A short I made with others, before Gobelins, at the Communication
    University of China. A reunion night, streets full of temple-fair
    spirits and lanterns.
  fr: >-
    Un court métrage fait à plusieurs, avant les Gobelins, à la
    Communication University of China. Une nuit de retrouvailles, des
    rues pleines de lanternes et d'esprits venus de la fête du temple.
  zh: >-
    去高布兰之前，我和别人一起在中国传媒大学做的短片。团圆之夜，街上是庙会的精怪和灯笼。
cover: hero.png
coverAlt:
  en: A crowded, lantern-lit temple street with a golden-robed deity figure, a guardian lion statue and a grinning child
  fr: Une rue de temple animée et éclairée de lanternes, avec une divinité en robe dorée, un lion gardien et une enfant souriante
  zh: 灯笼高挂的热闹庙会街道，金袍神将、护法石狮与咧嘴笑的孩童
