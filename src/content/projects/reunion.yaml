    alt:
      en: "The gods' offering table. The offerings of the humans unroll slowly along a painted scroll, drifting past like conveyor-belt sushi."
      fr: "La table d'offrandes des dieux. Les offrandes des humains se déroulent lentement sur un rouleau peint, et défilent comme des sushis sur un tapis roulant."
      zh: 神明的供桌，人类的供品在画卷上徐徐展开，像回转寿司一样，慢慢流动。
