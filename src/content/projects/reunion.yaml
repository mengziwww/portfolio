description:
  en: >-
    A short I made with others, before Gobelins, at the Communication
    University of China. A reunion night, streets full of temple-fair
    spirits and lanterns.
  fr: >-
    Un court que j'ai fait avec d'autres, avant les Gobelins, à la
    Communication University of China. Une nuit de retrouvailles, des
    rues pleines d'esprits de fête et de lanternes.
  zh: >-
    去高布兰之前，我和别人一起在中国传媒大学做的短片。团圆之夜，街上是庙会的精怪和灯笼。
cover: hero.png
coverAlt:
  en: A crowded, lantern-lit temple street with a golden-robed deity figure, a guardian lion statue and a grinning child
  fr: Une rue de temple animée et éclairée de lanternes, avec une divinité en robe dorée, un lion gardien et une enfant souriante
  zh: 灯笼高挂的热闹庙会街道，金袍神将、护法石狮与咧嘴笑的孩童
