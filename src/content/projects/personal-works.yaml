title: Personal works
year: 2025
category: personal
template: sketchbook
order: 8
size: wide
accentFrom: "#8A5A3A"
accentTo: "#161310"
roles:
  en: [Drawing]
  fr: [Dessin]
  zh: [画]
subtitle:
  en: smaller pieces, in a few piles
  fr: des pièces plus petites, en quelques tas
  zh: 一些小作品，分成几叠
description:
  en: Placeholder. Drawings, commissions and fan art. I'll write about each pile later.
  fr: Texte provisoire. Dessins, commandes et fan art. J'écrirai sur chaque tas plus tard.
  zh: 先放着。画、委托和同人。每一叠我之后再写。
cover: cover.png
coverAlt:
  en: "For a while I kept dreaming of the sea. My anxiety was like a tree swaying in a storm. It looks fragile, but it bends and doesn't fall easily. It doesn't fight back. It just grows."
  fr: "Pendant un temps, je rêvais sans arrêt de la mer. Mon anxiété ressemblait à un arbre secoué par la tempête. Il a l'air fragile, mais il plie et ne tombe pas facilement. Il ne lutte pas. Il pousse, simplement."
  zh: "有段时间总是梦见大海，我的焦虑像风暴中摇曳的树，虽然看起来脆弱，但也有韧性，不会轻易被刮倒。不对抗，只是生长。"
