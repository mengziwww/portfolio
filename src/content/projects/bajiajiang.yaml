description:
  en: >-
    A pipeline exercise at Gobelins: the early stage of a film, from the
    concept to the storyboard. Everything but the animation.
    I went to Fujian for a traditional parade where people walk with
    their gods. Their lives don't look especially protected. They are
    happy anyway. Faith gives them room to breathe, and a life that is
    their own. The story follows a 14 year old boy. He is restless, and
    he wants a thrill. With no parents looking after him, he lives with
    the older boys from the hall. They train and parade as Bajiajiang.
    Then one day, just before the New Year parade, that simple happiness
    seems to be ending.
  fr: >-
    Un exercice de pipeline aux Gobelins : la première étape d'un film,
    du concept jusqu'au storyboard. Tout sauf l'animation.
    Je suis allée dans le Fujian pour une procession traditionnelle,
    où les gens marchent avec leurs dieux. Leur vie n'a pas l'air
    particulièrement protégée. Ils sont heureux quand même. La foi leur
    laisse un endroit pour respirer, et une vie à eux. L'histoire suit
    un garçon de 14 ans. Il est rebelle, il a besoin de sensations.
    Sans parents pour le surveiller, il vit avec les frères de la salle.
    Ensemble ils s'entraînent et défilent en Bajiajiang. Un jour, juste
    avant la procession du Nouvel An, cette vie simple et joyeuse semble
    arriver au bout.
  zh: >-
    这是在高布兰做的一次流程练习：一部片子的前期，从概念一直做到分镜。除了动画，其他都有。
    我曾经去过中国福建，参加传统游神。那里的人与神同行，生活看起来却并不被护佑。
    即便如此，他们仍然快乐。信仰让他们在现实里有了喘息的地方，也带给他们不一样的生活。
    故事的主人公是一个14岁的初中男孩。他叛逆，也需要刺激。没有父母管教，他更多和堂口的兄弟们一起生活。
    大家经常做八家将的游神训练和活动。可有一天，春节游神之前，这样简单快乐的生活似乎走到了尽头。
