story:
  en: Sophie heads out to cheer her brother Benoit up. He's been in a bad place.
  fr: Sophie prend la route pour rendre le sourire à son frère Benoit, qui traverse une mauvaise passe.
  zh: 苏菲上路，想让哥哥博努瓦重新高兴起来。他最近很不好。
description:
  en: >-
    I was the character designer: Sophie, Benoit, Thomas and the
    others, plus the free-flowing lasso designs. In production I did
    layout posing, then became one of the lead animators. I like small
    gestures and subtle expressions, they bring the characters to life
    and push the comedy as far as it goes. In post-production I did the
    compositing, and at the very start I also tried the storyboard.
  fr: >-
    J'étais la character designer du film : Sophie, Benoit, Thomas et
    les autres, ainsi que les designs « lasso », tout en souplesse. En
    production, j'ai fait le posing du layout, puis je suis devenue
    l'une des animatrices principales. J'aime jouer avec les petits
    gestes et les expressions subtiles : ça donne vie aux personnages et
    ça pousse leur côté comique le plus loin possible. En
    post-production, j'ai fait le compositing, et tout au début, j'ai
    aussi fait des essais de storyboard.
  zh: 我是这部片子的角色设计：苏菲、博努瓦、托马和其他角色，还有自由流动的「套索」设计。制作阶段我先做 layout 姿态，后来成为主要动画师之一。我喜欢用细小的动作和微妙的表情去表演，让角色活起来，把他们的喜剧感推到最大。后期我做了合成，片子刚开始制作的时候，我也试着画了分镜。
