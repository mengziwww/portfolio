description:
  en: >-
    Sophie heads out to cheer her brother Benoit up. He's been in a bad
    place. I'm doing the concept, the characters and the animation.
    The film isn't finished yet.
  fr: >-
    Sophie prend la route pour rendre le sourire à son frère Benoit.
    Il va mal. Je fais le concept, les personnages et l'animation.
    Le film n'est pas encore fini.
  zh: >-
    苏菲上路，想让哥哥博努瓦重新高兴起来。他最近很不好。概念、角色和动画
    是我在做的。片子还没完成。
cover: style-frame2.png
coverAlt:
  en: A mother and daughter sit together in a golden sunflower field at sunset, petals drifting on the breeze
  fr: Une mère et sa fille assises ensemble dans un champ de tournesols doré au coucher du soleil, des pétales portés par le vent
  zh: 母女俩并肩坐在夕阳下的金色向日葵田中，花瓣随风飘落
