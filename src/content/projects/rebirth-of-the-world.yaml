title: Rebirth of the World
year: 2025
category: personal
template: atmosphere
order: 1
size: large
accentFrom: "#1B2A4A"
accentTo: "#FFD866"
posterCredit:
  en: I'm still working on it
  fr: j'y travaille encore
  zh: 我还在做
roles:
  en: [Solo, Personal project]
  fr: [Solo, Projet personnel]
  zh: [独立创作, 个人项目]
subtitle:
  en: a world in progress since 2023
  fr: un monde en cours depuis 2023
  zh: 从2023年做到现在的世界
description:
  en: >-
    This project has always lived in my mind. It is about the world being
    reloaded, one version replacing the last, and it could be a seven minute film,
    a long comic, or a series. A little girl becomes the last person in
    the world, and she is about to die. She thinks she is not afraid of
    death, but then a being who calls himself a messenger appears in
    front of her. He tells her a new world is about to be born.
  fr: >-
    Ce projet a toujours vécu dans ma tête. Il parle du monde qui se
    recharge, d'une version qui remplace la précédente, et ça peut être un film de
    sept minutes, une longue bande dessinée ou une série. Une petite
    fille devient la dernière personne au monde, et elle va mourir.
    Elle croit qu'elle n'a pas peur de la mort, mais un être qui se dit
    messager apparaît devant elle. Il lui dit qu'un nouveau monde va naître.
  zh: >-
    这个项目一直在我心里。这个故事关于世界的重新载入、版本更迭，可以是一个七分钟的短片，也可以是长长连载的漫画或剧集。一个小女孩成为了世界上的最后一个人，她即将死去。她以为她不害怕死亡，可在她面前出现了一名自称为使者的人形生物。使者告诉她，新的世界就要诞生了。
cover: garden-child.png
coverAlt:
  en: A small orange-haired figure stands in tall grass at night, fireflies and star-flowers glowing around her
  fr: Une petite silhouette aux cheveux orange se tient dans les hautes herbes la nuit, entourée de lucioles et de fleurs étoilées lumineuses
  zh: 一个橙发的小小身影站在夜色中的高草丛里，萤火虫与星形花朵在周围发光
