video: /videos/emma/emma.mp4
videoNote:
  en: "The idea came from the composer of the music, who told me the story of a girl whose trauma slowly led her into drug addiction. It was the first time I took on such a serious subject head-on. To me, young people in France are upright and sincere, and addiction is not always a choice. So I made this story."
  fr: "L'idée vient du compositeur de la musique, qui m'a raconté l'histoire d'une fille que son traumatisme a peu à peu menée vers la drogue. C'était la première fois que j'abordais un sujet aussi grave de front. Pour moi, les jeunes en France sont droits et sincères, et l'addiction n'est pas toujours un choix. Alors j'ai raconté cette histoire."
  zh: "这个故事来自一个被点燃的念头。音乐的作者跟我讲了一个女孩的故事：心理创伤让她一步步走向了药物成瘾。这是我第一次正面去碰这么严肃的题目。在我眼里，法国的年轻人正直又单纯，而成瘾并不总是自己选的。于是有了这个故事。"
