description:
  en: >-
    I directed this ad, from the concept through to the backgrounds.
    It starts in a wasteland of scrap and wire, then opens onto something
    brighter. Click an image to see it in its original colors.
  fr: >-
    J'ai réalisé cette pub, du concept jusqu'aux décors. Ça commence
    dans un terrain vague de ferraille et de fil de fer, puis ça s'ouvre
    sur quelque chose de plus clair. Clique une image pour la voir dans
    ses couleurs d'origine.
  zh: >-
    这支广告我导演的，从概念做到背景。影片从废铁和铁丝的荒地开始，
    再打开到更亮的地方。点开图片，可以看到原来的颜色。
